services:
  masterboss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masterboss-app
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS:-MDFhMTc3NTYtN2VmNS03ZWE3LWJlOTgtNDA3MDM2NGM2MDFiOjU0MDE1YzQ4LTViOTAtNDIwMC05ZmIwLTViYWMxYjgzZjRkZQ==}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat-2}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-BDwLS9UhWmV794dMkB0ZJQ5_-tsz3eNLuCrNM4UHMh7XxDVq3v-2_8OxNYKcqa-MOqESfJGsK6A_r_PAp22p6q4}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-vapid_private.pem}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:masterboss@example.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DB_PATH=/app/data/masterboss.db
      - FRONTEND_DIST=/app/frontend/dist
    volumes:
      - masterboss_data:/app/data

volumes:
  masterboss_data:
    driver: local
